<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />

    <title>First activity</title>
  </head>
  <body>
    <div class="container-fluid p-4">
      <div class="row g-4 mb-4">
        <div class="col-3">
          <div class="box top-tall-steak">
            <img src="images/Steak_JE4_BE3.webp" alt="Steak" />
          </div>
        </div>
        <div class="col-6">
          <div class="box top-tall-rice">
            <img src="images/rice2.png" alt="Rice" />
          </div>
        </div>
        <div class="col-3">
          <div class="d-flex flex-column gap-4 h-100">
            <div class="box top-small-cookies">
              <img src="images/cookies.png" alt="Cookies" />
            </div>
            <div class="box top-small-apples">
              <img src="images/apples.png" alt="Apples" />
            </div>
          </div>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-2">
          <div class="d-flex flex-column gap-4">
            <div class="box bottom-tall-more"></div>
          </div>
        </div>
        <div class="col-3">
          <div class="box bottom-tall-cake">
            <img src="images/cake.png" alt="Cake" />
          </div>
        </div>
        <div class="col-3">
          <div class="box bottom-tall-salad">
            <img src="images/Mixed_Salad.webp" alt="Salad" />
          </div>
        </div>
        <div class="col-4">
          <div class="box bottom-tall-diet"></div>
        </div>
      </div>
    </div>
    </div>
  </body>
</html>
