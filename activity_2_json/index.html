<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style></style>
  </head>

  <body>
    <div class="container-fluid p-4">
      <div class="row">
        <div class="col">
          <div class="card shadow p-5 text-center">
            <div class="h1">Team Fortress 2 mercs</div>
          </div>
        </div>
      </div>
    </div>
    <div class="container mt-5">
      <div class="row" id="parent"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      var mercs = [
        {
          tf2class: "Scout",
          type: "(Offense)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Soldier",
          type: "(Offense)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Pyro",
          type: "(Offense)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Demoman",
          type: "(Defense)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Heavy",
          type: "(Defense)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Engineer",
          type: "(Defense)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Medic",
          type: "(Support)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Sniper",
          type: "(Support)",
          description: "",
          isLoggedIn: true,
        },
        {
          tf2class: "Spy",
          type: "(Support)",
          description: "",
          isLoggedIn: true,
        },
      ];
      var elParent = document.getElementById("parent");
      for (var i = 0; i < mercs.length; i++) {
        elParent.innerHTML +=
          `<div class="row">
          <div class="col">
          <div class="card p-3 my-3 shadow rounded-4 text-center">
            <div class="h3" id=>` +
          mercs[i].tf2class +
          " " +
          mercs[i].type +
          `</div>
            <div class="mt-3">
              Lorem ipsum dolor sit, amet consectetur adipisicing elit. Vitae
              quidem molestiae natus quia obcaecati, asperiores illo architecto
              similique odio adipisci mollitia veritatis. Perspiciatis hic,
              doloribus neque similique libero voluptas laudantium!
            </div>
          </div>
        </div>`;
      }
    </script>
  </body>
</html>
